    <title>PAC-RAMPAGE: MAZE BREAKER</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #05060a;
        height: 100%;
        height: 100dvh;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        color-scheme: dark;
      }
      #c {
        display: block;
        background: #05060a;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: calc(10px + env(safe-area-inset-top, 0px))
          calc(14px + env(safe-area-inset-right, 0px)) 10px
          calc(14px + env(safe-area-inset-left, 0px));
        font-family: "Segoe UI", Arial, sans-serif;
        color: #fff;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        text-shadow: 0 0 6px #000;
        z-index: 5;
        gap: 8px;
      }
      #hud .box {
        font-size: clamp(11px, 3.2vw, 14px);
        line-height: 1.4;
      }
      #rightBox {
        padding-top: 34px;
      }
      #combo {
        font-size: clamp(16px, 5vw, 22px);
        font-weight: 800;
        color: #0ff;
        text-shadow: 0 0 10px #0ff;
      }
      #meterWrap {
        position: fixed;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        width: min(60vw, 320px);
        height: 14px;
        background: #111;
        border: 2px solid #333;
        border-radius: 8px;
        overflow: hidden;
        z-index: 5;
        pointer-events: none;
      }
      body.touch #meterWrap {
        top: calc(52px + env(safe-area-inset-top, 0px));
        bottom: auto;
        width: min(50vw, 240px);
      }
      #meterFill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #0ff, #f0f, #ff0);
        transition: width 0.1s;
      }
      #pauseBtn {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top, 0px));
        right: calc(10px + env(safe-area-inset-right, 0px));
        z-index: 6;
        background: #111a;
        color: #0ff;
        border: 1px solid #0ff;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 16px;
        pointer-events: auto;
        min-width: 44px;
        min-height: 44px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        display: none;
      }
      #fsBtn {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top, 0px));
        right: calc(58px + env(safe-area-inset-right, 0px));
        z-index: 6;
        background: #111a;
        color: #0ff;
        border: 1px solid #0ff;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 16px;
        pointer-events: auto;
        min-width: 44px;
        min-height: 44px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        display: none;
      }
      #menu,
      #title {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        font-family: Arial, sans-serif;
        z-index: 10;
        gap: 14px;
        padding: max(16px, env(safe-area-inset-top, 0px))
          max(16px, env(safe-area-inset-right, 0px))
          max(16px, env(safe-area-inset-bottom, 0px))
          max(16px, env(safe-area-inset-left, 0px));
        box-sizing: border-box;
        overflow: auto;
        opacity: 1;
        transition: opacity 0.28s ease;
      }
      #title.hidescr,
      #menu.hidescr {
        opacity: 0;
        pointer-events: none;
      }
      #title h1 {
        font-size: clamp(22px, 6vw, 54px);
        color: #0ff;
        text-shadow: 0 0 20px #0ff;
        letter-spacing: 2px;
        text-align: center;
        margin: 0;
      }
      button.gbtn {
        background: #111;
        color: #0ff;
        border: 2px solid #0ff;
        border-radius: 8px;
        padding: 12px 28px;
        font-size: 16px;
        cursor: pointer;
        min-width: min(200px, 80vw);
        min-height: 44px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      button.gbtn:hover {
        background: #0a2222;
      }
      button.gbtn:active {
        background: #0ff;
        color: #000;
      }
      button.gbtn:focus-visible,
      input:focus-visible {
        outline: 3px solid #ffee00;
        outline-offset: 3px;
      }
      #joy {
        position: fixed;
        left: calc(16px + env(safe-area-inset-left, 0px));
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));

        height: 110px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(0, 255, 255, 0.4);

        touch-action: none;

      #joyStick {
        position: absolute;
        left: 35px;
        top: 35px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(0, 255, 255, 0.5);
        pointer-events: none;
      }
      #dashBtn {
        position: fixed;
        right: calc(20px + env(safe-area-inset-right, 0px));
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: rgba(255, 0, 255, 0.25);
        border: 2px solid #f0f;
        color: #fff;
        font-size: 12px;
        z-index: 5;
        display: none;
        align-items: center;
        justify-content: center;
        touch-action: none;
        -webkit-user-select: none;

      #settings {
        width: min(340px, 92vw);

      #settings label {

      #tutorial {

      #statsLine {

      @media (max-height: 500px) {
        body.touch #meterWrap {

        #joy {
          width: 88px;
          height: 88px;
        }
        #joyStick {
          left: 28px;
          top: 28px;
          width: 32px;
          height: 32px;
        }
        #dashBtn {
          width: 60px;
          height: 60px;
        }
      }
      .hidden {
        display: none !important;
      }
      #swToast {
        position: fixed;
        left: 50%;
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        z-index: 20;
        display: none;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        background: #111;
        color: #0ff;
        border: 2px solid #0ff;
        border-radius: 8px;
        padding: 10px 14px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        box-shadow: 0 0 16px rgba(0, 255, 255, 0.25);
        max-width: min(92vw, 420px);
      }
      #swToast.show {
        display: flex;
      }
      #swToast button {
        background: #0ff;
        color: #000;
        border: 0;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 13px;
        cursor: pointer;
        min-height: 36px;
        touch-action: manipulation;
      }
      #swToast button:focus-visible {
        outline: 3px solid #ffee00;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        #meterFill {
          transition: none;
        }
        #title,
        #menu {
          transition: none;
        }
      }
    </style>

  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="box">
        SCORE: <span id="score">0</span><br />MASS: <span id="mass">1.0</span>
      </div>
      <div id="combo">x1</div>
      <div class="box" id="rightBox" style="text-align: right">
        LIVES: <span id="lives">3</span><br />LVL: <span id="lvl">1</span>

    <button id="pauseBtn" aria-label="Pause game">Pause</button>
    <button id="fsBtn" aria-label="Toggle fullscreen">FS</button>

    <div id="title" role="dialog" aria-labelledby="titleHeading">
      <h1 id="titleHeading">

        >
      </h1>
      <p
        id="titleBlurb"

    <noscript>
      <p
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #0ff;
          font-family: Arial, sans-serif;
          background: #05060a;

    <div id="menu" class="hidden" role="dialog" aria-labelledby="pauseHeading">
      <h2 id="pauseHeading" style="color: #0ff">PAUSED</h2>

    <script>
      "use strict";
      function $(id) {
        return document.getElementById(id);
      }
      const memStore = {};
      const storage = {
        get(k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return Object.prototype.hasOwnProperty.call(memStore, k)
              ? memStore[k]
              : null;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
          } catch (e) {
            memStore[k] = String(v);
          }
        },
      };
      const canvas = $("c");
      const ctx =
        (canvas &&
          (canvas.getContext("2d", { alpha: false }) ||
            canvas.getContext("2d"))) ||
        null;
      let W,
        H,
        DPR,
        mazeW = 0,
        mazeH = 0,
        state = "title";
      const TITLE_BLURB =
        "Smash the maze. Eat power. Trigger RAMPAGE. Survive the ghosts.";
      const reduceMotionPref = !!(
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
      );
      const SETTINGS_KEY = "pacRampageSettings";
      const settings = {
        master: 0.8,
        sfx: 1,
        mute: false,
        shake: true,
        haptics: true,
        reducedFx: reduceMotionPref,
        seenTutorial: false,
      };
      (function loadSettings() {
        try {
          const raw = storage.get(SETTINGS_KEY);
          if (!raw) return;
          const o = JSON.parse(raw);
          if (o && typeof o === "object") {
            if (typeof o.master === "number")
              settings.master = Math.max(0, Math.min(1, o.master));
            if (typeof o.sfx === "number")
              settings.sfx = Math.max(0, Math.min(1, o.sfx));
            if (typeof o.mute === "boolean") settings.mute = o.mute;
            if (typeof o.shake === "boolean") settings.shake = o.shake;
            if (typeof o.haptics === "boolean") settings.haptics = o.haptics;
            if (typeof o.reducedFx === "boolean")
              settings.reducedFx = o.reducedFx;
            if (typeof o.seenTutorial === "boolean")
              settings.seenTutorial = o.seenTutorial;
          }
        } catch (e) {}
      })();
      function saveSettings() {
        try {
          storage.set(SETTINGS_KEY, JSON.stringify(settings));
        } catch (e) {}
      }
      let soundOn = !settings.mute;
      function reduceMotion() {
        return reduceMotionPref || settings.reducedFx;
      }
      function qualityLow() {
        return settings.reducedFx || qualityTier < 2;
      }

      let qualityTier = 2;
      let dprCap = 2;
      const frameTimes = [];
      let frameTimeSum = 0;

      function viewportSize() {
        const vv = window.visualViewport;
        if (vv && vv.width > 0 && vv.height > 0)
          return { w: Math.round(vv.width), h: Math.round(vv.height) };
        return { w: window.innerWidth || 320, h: window.innerHeight || 240 };
      }
      function resize() {
        if (!canvas || !ctx) return;
        DPR = Math.min(window.devicePixelRatio || 1, dprCap);
        const vs = viewportSize();
        W = vs.w;
        H = vs.h;
        canvas.width = Math.max(1, Math.round(W * DPR));
        canvas.height = Math.max(1, Math.round(H * DPR));
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        if (state === "playing" || state === "paused") syncMazeToViewport();
      }
      function syncMazeToViewport() {
        if (!grid || !COLS || !ROWS) return;
        const newCols = Math.max(16, Math.floor(W / TILE));
        const newRows = Math.max(12, Math.floor((H - 40) / TILE));
        if (newCols === COLS && newRows === ROWS && mazeW === W && mazeH === H)
          return;
        const oldCols = COLS,
          oldRows = ROWS;
        const nx = newCols / oldCols,
          ny = newRows / oldRows;
        COLS = newCols;
        ROWS = newRows;
        mazeW = W;
        mazeH = H;
        const next = [];
        for (let y = 0; y < ROWS; y++) {
          const row = [];
          for (let x = 0; x < COLS; x++) {
            if (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1) {
              row.push(-1);
              continue;
            }
            const ox = Math.min(oldCols - 2, Math.max(1, Math.floor(x / nx)));
            const oy = Math.min(oldRows - 2, Math.max(1, Math.floor(y / ny)));
            const src = grid[oy] && grid[oy][ox];
            row.push(
              src && typeof src === "object"
                ? { hp: src.hp, max: src.max, type: src.type }
                : src === -1
                  ? null
                  : src,
            );
          }
          next.push(row);
        }
        grid = next;
        player.x = Math.max(
          TILE + player.r,
          Math.min(COLS * TILE - TILE - player.r, player.x * nx),
        );
        player.y = Math.max(
          TILE + player.r,
          Math.min(ROWS * TILE - TILE - player.r, player.y * ny),
        );
        for (const g of ghosts) {
          g.x = Math.max(
            TILE + g.r,
            Math.min(COLS * TILE - TILE - g.r, g.x * nx),
          );
          g.y = Math.max(
            TILE + g.r,
            Math.min(ROWS * TILE - TILE - g.r, g.y * ny),
          );
        }
        for (const p of pellets) {
          p.x *= nx;
          p.y *= ny;
        }
        for (const q of regrowQueue) {
          q.gx = Math.min(COLS - 2, Math.max(1, Math.round(q.gx * nx)));
          q.gy = Math.min(ROWS - 2, Math.max(1, Math.round(q.gy * ny)));
        }
        if (spawnPoint) {
          spawnPoint.cx = Math.min(
            COLS - 2,
            Math.max(1, Math.round(spawnPoint.cx * nx)),
          );
          spawnPoint.cy = Math.min(
            ROWS - 2,
            Math.max(1, Math.round(spawnPoint.cy * ny)),
          );
        }
        cam.x = player.x;
        cam.y = player.y;
        snapRenderState();
        const tiles = nearbyTiles(player.x, player.y, player.r + 2);
        for (const { gx, gy } of tiles) {
          if (gx <= 0 || gy <= 0 || gx >= COLS - 1 || gy >= ROWS - 1) continue;
          if (grid[gy][gx] && grid[gy][gx] !== -1) grid[gy][gx] = null;
        }
      }

      let actx = null,
        masterGain = null,
        sfxGain = null,
        musicGain = null,
        rumble = null,
        musicNodes = null;
      function ensureAudio() {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) {
            soundOn = false;
            return;
          }
          if (!actx) {
            actx = new AC();
            masterGain = actx.createGain();
            sfxGain = actx.createGain();
            musicGain = actx.createGain();
            sfxGain.connect(masterGain);
            musicGain.connect(masterGain);
            masterGain.connect(actx.destination);
            applyGains();
          }
          if (actx.state === "suspended") {
            const p = actx.resume();
            if (p && p.catch) p.catch(() => {});
          }
        } catch (e) {
          soundOn = false;
        }
      }
      function applyGains() {
        if (!masterGain) return;
        const on = soundOn && !settings.mute;
        masterGain.gain.value = on ? settings.master : 0;
        if (sfxGain) sfxGain.gain.value = settings.sfx;
        if (musicGain) musicGain.gain.value = on ? 0.22 : 0;
      }
      function beep(freq, dur, type, gain, slideTo) {
        if (!soundOn || settings.mute || !actx || !sfxGain) return;
        try {
          const t = actx.currentTime;
          const o = actx.createOscillator(),

      function resolveCircleTile(body, gx, gy) {
        const tx = gx * TILE,
          ty = gy * TILE;
        const cx = Math.max(tx, Math.min(body.x, tx + TILE));
        const cy = Math.max(ty, Math.min(body.y, ty + TILE));
        let dx = body.x - cx,
          dy = body.y - cy;
        const distSq = dx * dx + dy * dy;
        if (distSq < body.r * body.r) {
          let nx, ny, dist;
          if (distSq < 1e-8) {
            const left = body.x - tx,
              right = tx + TILE - body.x,
              top = body.y - ty,
              bot = ty + TILE - body.y;
            const m = Math.min(left, right, top, bot);
            if (m === left) {
              nx = -1;
              ny = 0;
              body.x = tx - body.r;
            } else if (m === right) {
              nx = 1;
              ny = 0;
              body.x = tx + TILE + body.r;
            } else if (m === top) {
              nx = 0;
              ny = -1;
              body.y = ty - body.r;
            } else {
              nx = 0;
              ny = 1;
              body.y = ty + TILE + body.r;

            dist = body.r;

            dist = Math.sqrt(distSq);
            nx = dx / dist;
            ny = dy / dist;

            body.x += nx * overlap;
            body.y += ny * overlap;

          const vDotN = body.vx * nx + body.vy * ny;

            body.vx -= 2 * vDotN * nx;

            }
          }
        for (let i = regrowQueue.length - 1; i >= 0; i--) {
          const q = regrowQueue[i];
          q.timer -= dt;
          if (q.timer <= 0) {
            if (grid[q.gy] && grid[q.gy][q.gx] === null) {
              const dpp = Math.hypot(
                q.gx * TILE + TILE / 2 - player.x,
                q.gy * TILE + TILE / 2 - player.y,
              );
              if (dpp > TILE * 2.5) {
                grid[q.gy][q.gx] = {
                  hp: MATS[q.type].hp,
                  max: MATS[q.type].hp,
                  type: q.type,
                };
                spawnBurst(
                  q.gx * TILE + TILE / 2,
                  q.gy * TILE + TILE / 2,
                  MATS[q.type].color,
                  6,
                );
              }
            }
            regrowQueue.splice(i, 1);
          }
        }
        debrisPool.update(dt, (o) => {
          o.life += dt;
          o.x += o.vx * dt;
          o.y += o.vy * dt;
          o.vx *= 0.94;
          o.vy *= 0.94;
          if (o.alive) {
            for (const g of ghosts) {
              const ddx = o.x - g.x,
                ddy = o.y - g.y,
                dd = Math.hypot(ddx, ddy);
              if (dd < (o.r || 2) + g.r && dd > 0.001) {
                const nx = ddx / dd,
                  ny = ddy / dd;
                const debrisMomentum = Math.hypot(o.vx, o.vy) * 0.15;
                g.vx -= nx * debrisMomentum * 0.1;
                g.vy -= ny * debrisMomentum * 0.1;
                o.vx *= 0.3;
                o.vy *= 0.3;
              }
            }
          }
          if (o.life >= o.maxLife) o.alive = false;
        });
        particlePool.update(dt, (o) => {
          o.life += dt;
          o.x += o.vx * dt;
          o.y += o.vy * dt;
          o.vx *= 0.9;
          o.vy *= 0.9;
          if (o.life >= o.maxLife) o.alive = false;
        });
        trailPool.update(dt, (o) => {
          o.life += dt;
          if (o.life >= o.maxLife) o.alive = false;
        });
        const targetZoom = Math.max(
          0.65,
          1.1 -
            spd / 900 -
            player.mass * 0.01 -
            (player.rampageActive ? 0.25 : 0),
        );
        cam.zoom += (targetZoom - cam.zoom) * Math.min(1, dt * 3);
        cam.x += (player.x - cam.x) * Math.min(1, dt * 4);
        cam.y += (player.y - cam.y) * Math.min(1, dt * 4);
        shakeTime = Math.max(0, shakeTime - dt);
        if (shakeTime <= 0) shakeMag *= 0.9;
        flashAlpha = Math.max(0, flashAlpha - dt * 1.2);
        updateMusicIntensity();
      }
      function gameOver() {
        state = "gameover";
        sfxGameOver();
        setRumble(false);
        stopMusic();
        resetTouchStick();
        if (pauseBtn) pauseBtn.style.display = "none";
        if (isTouch && joy && dashBtn) {
          joy.style.display = "none";
          dashBtn.style.display = "none";
        }
        if (tutorialEl) tutorialEl.style.display = "none";
        const secs = Math.max(1, Math.round(runStats.time));
        if (titleBlurb)
          titleBlurb.textContent =
            "GAME OVER — Score: " + player.score + "  BEST: " + highScore;
        if (statsLine) {
          statsLine.classList.remove("hidden");
          statsLine.textContent =
            "Pellets " +
            runStats.pellets +
            " • Near-miss " +
            runStats.nearMiss +
            " • Walls " +
            runStats.walls +
            " • Ghosts " +
            runStats.ghosts +
            " • Max combo x" +
            runStats.maxCombo.toFixed(1) +
            " • " +
            secs +
            "s";
        }
        setTimeout(() => {
          showOverlay(titleEl, true);
          state = "title";
        }, 800);
      }
      const sprites = {};
      function makeGlowSprite(color, size) {
        const c = document.createElement("canvas");
        c.width = size;
        c.height = size;
        const g = c.getContext("2d");
        if (!g) return c;
        const grd = g.createRadialGradient(
          size / 2,
          size / 2,
          0,
          size / 2,
          size / 2,
          size / 2,
        );
        grd.addColorStop(0, color);
        grd.addColorStop(0.35, color);
        grd.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = grd;
        g.fillRect(0, 0, size, size);
        return c;
      }
      function ensureSprites() {
        if (sprites.ready) return;
        sprites.pellet = makeGlowSprite("rgba(102,234,255,1)", 32);
        sprites.power = makeGlowSprite("rgba(255,238,0,1)", 48);
        sprites.player = makeGlowSprite("rgba(0,229,255,0.95)", 64);
        sprites.playerRage = makeGlowSprite("rgba(255,238,0,0.95)", 80);
        sprites.part = makeGlowSprite("rgba(0,255,255,0.9)", 24);
        sprites.ghost = {};
        for (const k in GHOST_COLORS)
          sprites.ghost[k] = makeGlowSprite(GHOST_COLORS[k], 48);
        sprites.ready = true;
      }
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }
      function lerpAngle(a, b, t) {
        let d = b - a;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        return a + d * t;
      }
      function render(a) {
        if (!grid || !ctx) return;
        ensureSprites();
        const t = a == null ? 1 : a;
        const px = lerp(player.px, player.x, t);
        const py = lerp(player.py, player.y, t);
        const pang = lerpAngle(player.pangle, player.angle, t);
        const cx = lerp(cam.px, cam.x, t);
        const cy = lerp(cam.py, cam.y, t);
        const cz = lerp(cam.pzoom, cam.zoom, t);
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        let sx = 0,
          sy = 0;
        if (shakeMag > 0.1 && settings.shake && !reduceMotion()) {
          sx = (Math.random() - 0.5) * shakeMag;
          sy = (Math.random() - 0.5) * shakeMag;
        }
        ctx.translate(W / 2 + sx, H / 2 + sy);
        ctx.scale(cz, cz);
        ctx.translate(-cx, -cy);
        ctx.fillStyle = "#05060a";
        ctx.fillRect(cx - W, cy - H, W * 2, H * 2);
        const viewHalfW = W / 2 / cz + TILE,
          viewHalfH = H / 2 / cz + TILE;
        const xStart = Math.max(0, Math.floor((cx - viewHalfW) / TILE));
        const xEnd = Math.min(COLS - 1, Math.ceil((cx + viewHalfW) / TILE));
        const yStart = Math.max(0, Math.floor((cy - viewHalfH) / TILE));
        const yEnd = Math.min(ROWS - 1, Math.ceil((cy + viewHalfH) / TILE));
        for (let y = yStart; y <= yEnd; y++)
          for (let x = xStart; x <= xEnd; x++) {
            const cell = grid[y][x];
            if (cell === -1) {
              ctx.fillStyle = "#111827";
              ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
            } else if (cell) {
              const c = MATS[cell.type].color;
              const pct = cell.hp / cell.max;
              ctx.fillStyle = c;
              ctx.globalAlpha = 0.5 + 0.5 * pct;
              ctx.fillRect(x * TILE + 1, y * TILE + 1, TILE - 2, TILE - 2);
              ctx.globalAlpha = 1;
              ctx.strokeStyle = "rgba(0,255,255,0.15)";
              ctx.strokeRect(x * TILE + 1, y * TILE + 1, TILE - 2, TILE - 2);
            }
          }
        for (const p of pellets) {
          if (
            p.x < cx - viewHalfW ||
            p.x > cx + viewHalfW ||
            p.y < cy - viewHalfH ||
            p.y > cy + viewHalfH
          )
            continue;
          const spr = p.power ? sprites.power : sprites.pellet;
          const s = p.power ? 18 : 10;
          ctx.drawImage(spr, p.x - s / 2, p.y - s / 2, s, s);
          ctx.beginPath();
          ctx.fillStyle = p.power ? "#ffee00" : "#66eaff";
          ctx.arc(p.x, p.y, p.power ? 7 : 3.5, 0, 7);
          ctx.fill();
        }
        trailPool.draw((o) => {
          ctx.globalAlpha = Math.max(0, 1 - o.life / o.maxLife) * 0.35;
          ctx.drawImage(
            o.color === "#ffee00" ? sprites.playerRage : sprites.player,
            o.x - o.r,
            o.y - o.r,
            o.r * 2,
            o.r * 2,
          );
        });
        debrisPool.draw((o) => {
          ctx.globalAlpha = Math.max(0, 1 - o.life / o.maxLife);
          ctx.fillStyle = o.color;
          ctx.fillRect(o.x - o.size / 2, o.y - o.size / 2, o.size, o.size);
        });
        particlePool.draw((o) => {
          ctx.globalAlpha = Math.max(0, 1 - o.life / o.maxLife);
          if (qualityTier > 0 && !settings.reducedFx) {
            const s = o.size * 4;
            ctx.drawImage(sprites.part, o.x - s / 2, o.y - s / 2, s, s);
          }
          ctx.fillStyle = o.color;
          ctx.beginPath();
          ctx.arc(o.x, o.y, o.size, 0, 7);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        for (const g of ghosts) {
          const gx = lerp(g.px, g.x, t),
            gy = lerp(g.py, g.y, t);
          ctx.save();
          ctx.translate(gx, gy);
          if (qualityTier > 0 && !settings.reducedFx && g.stunned <= 0) {
            const glow = sprites.ghost[g.type] || sprites.part;
            ctx.globalAlpha = 0.55;
            ctx.drawImage(glow, -g.r * 1.6, -g.r * 1.6, g.r * 3.2, g.r * 3.2);
            ctx.globalAlpha = 1;
          }
          ctx.fillStyle = g.stunned > 0 ? "#555" : g.color;
          ctx.beginPath();
          ctx.arc(0, -2, g.r, Math.PI, 0);
          ctx.lineTo(g.r, g.r * 0.7);
          for (let i = 0; i < 4; i++)
            ctx.lineTo(
              g.r - (i + 1) * (g.r / 2),
              i % 2 === 0 ? g.r * 0.4 : g.r * 0.7,
            );
          ctx.lineTo(-g.r, g.r * 0.7);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(-4, -3, 3, 0, 7);
          ctx.arc(4, -3, 3, 0, 7);
          ctx.fill();
          ctx.fillStyle = "#003";
          ctx.beginPath();
          ctx.arc(-4, -3, 1.4, 0, 7);
          ctx.arc(4, -3, 1.4, 0, 7);
          ctx.fill();
          ctx.restore();
        }
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(pang);
        if (player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0)
          ctx.globalAlpha = 0.4;
        if (qualityTier > 0 && !settings.reducedFx) {
          const glowSpr = player.rampageActive
            ? sprites.playerRage
            : sprites.player;
          const gs = player.r * (player.rampageActive ? 3.2 : 2.4);
          ctx.globalAlpha *= 0.7;
          ctx.drawImage(glowSpr, -gs / 2, -gs / 2, gs, gs);
          ctx.globalAlpha =
            player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0
              ? 0.4
              : 1;
        }
        ctx.fillStyle = player.rampageActive ? "#ffee00" : "#00e5ff";
        const mouthOpen =
          (Math.sin(player.mouthPhase) * 0.5 + 0.5) * 0.32 + 0.06;
        ctx.beginPath();
        ctx.arc(0, 0, player.r, mouthOpen * Math.PI, (2 - mouthOpen) * Math.PI);
        ctx.lineTo(0, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
        ctx.restore();
        if (flashAlpha > 0) {
          ctx.fillStyle = "rgba(255,240,0," + flashAlpha * 0.3 + ")";
          ctx.fillRect(0, 0, W, H);
        }
      }
      function resetFrameSamples() {
        frameTimes.length = 0;
        frameTimeSum = 0;
      }
      function noteFrame(ms) {
        if (state !== "playing") return;
        frameTimes.push(ms);
        frameTimeSum += ms;
        if (frameTimes.length > 45) frameTimeSum -= frameTimes.shift();
        if (frameTimes.length < 30) return;
        const avg = frameTimeSum / frameTimes.length;
        if (avg > 22 && qualityTier > 0) {
          qualityTier--;
          if (qualityTier === 1) dprCap = 1.5;
          if (qualityTier === 0) dprCap = 1;
          debrisPool.cap =
            qualityTier === 0 ? 120 : qualityTier === 1 ? 280 : 500;
          particlePool.cap =
            qualityTier === 0 ? 80 : qualityTier === 1 ? 180 : 300;
          trailPool.cap = qualityTier === 0 ? 12 : qualityTier === 1 ? 40 : 80;
          resize();
        } else if (avg < 14 && qualityTier < 2 && !settings.reducedFx) {
          qualityTier++;
          dprCap = qualityTier === 2 ? 2 : 1.5;
          debrisPool.cap = qualityTier === 2 ? 500 : 280;
          particlePool.cap = qualityTier === 2 ? 300 : 180;
          trailPool.cap = qualityTier === 2 ? 80 : 40;
        }
      }
      function loop(now) {
        rafId = requestAnimationFrame(loop);
        pollGamepad({ x: 0, y: 0 });
        if (!lastT) lastT = now;
        let frameDt = Math.min(Math.max(0, (now - lastT) / 1000), 0.05);
        lastT = now;
        noteFrame(frameDt * 1000);
        if (state === "playing") {
          acc += frameDt;
          if (acc > MAX_ACC) acc = MAX_ACC;
          while (acc >= FIXED_DT) {
            update(FIXED_DT);
            acc -= FIXED_DT;
            if (state !== "playing") break;
          }
          alpha = acc / FIXED_DT;
        } else alpha = 1;
        if (state === "playing" || state === "paused")
          render(state === "playing" ? alpha : 1);
      }
      (function bindSettings() {
        const vm = $("volMaster"),
          vs = $("volSfx"),
          cm = $("chkMute"),
          cs = $("chkShake"),
          ch = $("chkHaptics"),
          cf = $("chkFx");
        if (vm) {
          vm.value = String(Math.round(settings.master * 100));
          vm.addEventListener("input", () => {
            settings.master = +vm.value / 100;
            saveSettings();
            applyGains();
          });
        }
        if (vs) {
          vs.value = String(Math.round(settings.sfx * 100));
          vs.addEventListener("input", () => {
            settings.sfx = +vs.value / 100;
            saveSettings();
            applyGains();
          });
        }
        if (cm) {
          cm.checked = settings.mute;
          cm.addEventListener("change", () => {
            if (cm.checked !== settings.mute) toggleMute();
          });
        }
        if (cs) {
          cs.checked = settings.shake;
          cs.addEventListener("change", () => {
            settings.shake = cs.checked;
            saveSettings();
          });
        }
        if (ch) {
          ch.checked = settings.haptics;
          ch.addEventListener("change", () => {
            settings.haptics = ch.checked;
            saveSettings();
          });
        }
        if (cf) {
          cf.checked = settings.reducedFx;
          cf.addEventListener("change", () => {
            settings.reducedFx = cf.checked;
            saveSettings();
            if (settings.reducedFx) {
              qualityTier = 0;
              dprCap = 1;
              debrisPool.cap = 120;
              particlePool.cap = 80;
              trailPool.cap = 12;
            } else {
              qualityTier = 2;
              dprCap = 2;
              debrisPool.cap = 500;
              particlePool.cap = 300;
              trailPool.cap = 80;
            }
            resize();
          });
        }
        syncMuteUI();
        if (settings.reducedFx) {
          qualityTier = 0;
          dprCap = 1;
          debrisPool.cap = 120;
          particlePool.cap = 80;
          trailPool.cap = 12;
        }
      })();
      (function absSocialMeta() {
        try {
          const img = new URL("icon-512.png", location.href).href;
          const page = new URL("./", location.href).href;
          const ogImg = document.querySelector('meta[property="og:image"]');
          const twImg = document.querySelector('meta[name="twitter:image"]');
          const ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogImg) ogImg.setAttribute("content", img);
          if (twImg) twImg.setAttribute("content", img);
          if (ogUrl) ogUrl.setAttribute("content", page);
        } catch (e) {}
      })();
      (function registerSW() {
        if (!("serviceWorker" in navigator)) return;
        const hadController = !!navigator.serviceWorker.controller;
        let reloading = false;
        const toast = $("swToast");
        const reloadBtn = $("swReloadBtn");
        const dismissBtn = $("swDismissBtn");
        function showToast() {
          if (toast) toast.classList.add("show");
        }
        function hideToast() {
          if (toast) toast.classList.remove("show");
        }
        function watchWaiting(reg) {
          const w = reg.waiting;
          if (!w) return;
          showToast();
        }
        if (reloadBtn) {
          reloadBtn.addEventListener("click", () => {
            navigator.serviceWorker
              .getRegistration()
              .then((reg) => {
                if (reg && reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
              })
              .catch(() => {});
          });
        }
        if (dismissBtn) dismissBtn.addEventListener("click", hideToast);
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (hadController && !reloading) {
            reloading = true;
            location.reload();
          }
        });
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("sw.js")
            .then((reg) => {
              watchWaiting(reg);
              reg.addEventListener("updatefound", () => {
                const nw = reg.installing;
                if (!nw) return;
                nw.addEventListener("statechange", () => {
                  if (
                    nw.state === "installed" &&
                    navigator.serviceWorker.controller
                  )
                    showToast();
                });
              });
            })
            .catch(() => {});
        });
      })();
      if (!rafId) rafId = requestAnimationFrame(loop);
    </script>
